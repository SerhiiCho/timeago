name: Build and test

on:
  push:
    branches: [master]
    paths-ignore: &docs
      - '**.md'
      - '.vscode/**'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches: [master]
    paths-ignore: *docs

jobs:
  build:
    name: Run checks for Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.21', '1.22', '1.23', '1.24', '1.25', '1.26', '1.27']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: webgtx/setup-podman-compose@v1

      - name: Build image
        run: make build

      - name: Run checks
        run: make

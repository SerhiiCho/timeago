name: Go

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Build
    runs-on: burn
    strategy:
      matrix:
        #go_version: [1.20, 1.21, 1.22, 1.23, 1.24, 1.25]
        go_version: [1.20]

    steps:
      - uses: actions/checkout@v4

      - name: Setup the correct timezone
        run: cp -f /usr/share/zoneinfo/Europe/Kiev /etc/localtime

      - name: Set up Go
        uses: https://github.com/actions/setup-go@v7
        with:
          # Version or version range of Go to use
          go-version: ${{ matrix.go_version }}

      - name: Install golangci-lint
        run: curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.8.0

      - name: Run checks
        run: make check

name: Run quality checks
enable-email-notifications: true

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Run checks for Go ${{ matrix.go-version }}
    runs-on: podman
    container: docker.io/library/node:26
    strategy:
      matrix:
        go-version: ['1.20', '1.21', '1.22', '1.23', '1.24', '1.25', '1.26']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup the correct timezone
        run: cp -f /usr/share/zoneinfo/Europe/Kiev /etc/localtime

      - name: Set up Go
        uses: https://github.com/actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install golangci-lint
        run: curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.8.0

      - name: Run checks
        run: make check
